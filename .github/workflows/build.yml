# GRAŃ – kompilacja programu (Rust) dla Windows (instalator NSIS) i Androida (APK) oraz wydanie na
# GitHub Releases. Program pobiera aktualizacje przez redzikowski.com (kopia wydań z GitHuba), więc
# wydanie musi zawierać instalator, APK i latest.yml (sumy SHA-512 obu plików, sprawdzane przed instalacją).
#
#  • push na main z nową wersją w Cargo.toml (brak tagu v<wersja>) → wydanie automatycznie
#  • push tagu v*        → wydanie tej wersji
#  • commit z „[release]” w treści → to samo; tag v<wersja z Cargo.toml> tworzy workflow
#  • push / pull request → kontrolna kompilacja i testy (artefakty przebiegu, bez publikacji)
#
# Podpis Windows (Authenticode) – sekrety repozytorium:
#   WIN_CSC_LINK (certyfikat .pfx w base64), WIN_CSC_KEY_PASSWORD
# Podpis Android – sekrety repozytorium (ten sam klucz co wersja 1.x, więc APK instaluje się jako aktualizacja):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Wersja i czy ma już wydanie
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Wersja $tag ma już wydanie."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "Nowa wersja $tag – bez wydania."
          fi
      - name: Wersja tagu zgodna z Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${{ steps.v.outputs.tag }}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} nie pasuje do wersji ${{ steps.v.outputs.tag }} z Cargo.toml"
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Testy
        run: cargo test --locked
      - name: Kompilacja
        run: cargo build --release --locked
      - name: Certyfikat
        if: env.CSC_LINK != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CSC_LINK))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          "SIGNTOOL=$($st.FullName)" >> $env:GITHUB_ENV
      - name: Podpis programu
        if: env.CSC_LINK != ''
        shell: pwsh
        run: '& $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:CSC_KEY_PASSWORD" /fd sha256 /tr http://timestamp.digicert.com /td sha256 target\release\Gran.exe'
      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe") { "${env:ProgramFiles(x86)}\NSIS" >> $env:GITHUB_PATH }
            else { choco install nsis -y --no-progress; "${env:ProgramFiles(x86)}\NSIS" >> $env:GITHUB_PATH }
          }
      - name: Instalator
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          makensis /V3 "/DVERSION=$env:VERSION" "/DEXE=..\target\release\Gran.exe" "/DOUT=..\release\GRAN-Setup-$env:VERSION.exe" build\gran.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Podpis instalatora
        if: env.CSC_LINK != ''
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:CSC_KEY_PASSWORD" /fd sha256 /tr http://timestamp.digicert.com /td sha256 "release\GRAN-Setup-$env:VERSION.exe"
          $sig = Get-AuthenticodeSignature "release\GRAN-Setup-$env:VERSION.exe"
          Write-Host "$($sig.Status) – $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/GRAN-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # cienkie LTO: dużo szybsza kompilacja, prawie ten sam rozmiar i szybkość
      CARGO_PROFILE_RELEASE_LTO: thin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")" >> "$GITHUB_ENV"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
      - name: Biblioteka natywna (Rust → arm64-v8a)
        run: cargo ndk -t arm64-v8a -P 26 -o android/app/src/main/jniLibs build --release --locked -p gran-android
      - name: Klucz podpisu
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/gran.keystore"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$ks"
            {
              echo "GRAN_ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
              echo "GRAN_ANDROID_KEY_ALIAS=$KS_ALIAS"
              echo "GRAN_ANDROID_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Brak sekretu ANDROID_KEYSTORE_BASE64 – APK podpisany kluczem jednorazowym."
            pass=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$ks" -storepass "$pass" -keypass "$pass" -alias gran \
              -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=GRAN, O=BlackSingularities, C=PL" >/dev/null
            echo "::add-mask::$pass"
            {
              echo "GRAN_ANDROID_KEYSTORE_PASSWORD=$pass"
              echo "GRAN_ANDROID_KEY_ALIAS=gran"
              echo "GRAN_ANDROID_KEY_PASSWORD=$pass"
            } >> "$GITHUB_ENV"
          fi
          echo "GRAN_ANDROID_KEYSTORE=$ks" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: APK
        run: gradle --no-daemon -p android assembleRelease
      - name: Weryfikacja podpisu
        run: |
          apk=$(ls android/app/build/outputs/apk/release/GRAN-*-release.apk)
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$bt/apksigner" verify --print-certs "$apk" | head -3
          "$bt/aapt2" dump badging "$apk" | head -3
          mkdir -p out && cp "$apk" "out/GRAN-$VERSION.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.new == 'true') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - run: ls -la dist-release
      - name: latest.yml (sumy SHA-512 dla aktualizatora Windows i Androida)
        run: |
          v="${{ needs.version.outputs.version }}"
          exe="GRAN-Setup-$v.exe"
          apk="GRAN-$v.apk"
          sha() { openssl dgst -sha512 -binary "dist-release/$1" | base64 -w0; }
          size() { stat -c %s "dist-release/$1"; }
          {
            echo "version: $v"
            echo "files:"
            echo "  - url: $exe"
            echo "    sha512: $(sha "$exe")"
            echo "    size: $(size "$exe")"
            echo "  - url: $apk"
            echo "    sha512: $(sha "$apk")"
            echo "    size: $(size "$apk")"
            echo "path: $exe"
            echo "sha512: $(sha "$exe")"
            echo "releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'"
          } > dist-release/latest.yml
          cat dist-release/latest.yml
      - name: Opis wydania
        run: |
          v="${{ needs.version.outputs.version }}"
          f="build/release-notes/$v.md"
          if [ -f "$f" ]; then cp "$f" notes.md
          else printf 'Instalator Windows `GRAN-Setup-%s.exe` i aplikacja na Androida `GRAN-%s.apk` – do pobrania ze strony https://redzikowski.com/portfolio/gran-3d. Zainstalowany program sam proponuje kolejne wersje.\n' "$v" "$v" > notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GRAŃ ${{ needs.version.outputs.tag }}
          make_latest: true
          body_path: notes.md
          generate_release_notes: true
          files: dist-release/*
          fail_on_unmatched_files: true
