# GRAŃ – kompilacja programu (Rust), instalator Windows (NSIS) i wydanie na GitHub Releases.
# Program pobiera aktualizacje przez redzikowski.com (kopia wydań z GitHuba), więc wydanie musi zawierać
# instalator i latest.yml (suma SHA-512, którą program sprawdza przed instalacją).
#
#  • push na main z nową wersją w Cargo.toml (brak tagu v<wersja>) → wydanie automatycznie
#  • push tagu v*        → wydanie tej wersji
#  • commit z „[release]” w treści → to samo; tag v<wersja z Cargo.toml> tworzy workflow
#  • push / pull request → kontrolna kompilacja i testy (artefakty przebiegu, bez publikacji)
#
# Podpis Windows (Authenticode) – sekrety repozytorium:
#   WIN_CSC_LINK (certyfikat .pfx w base64), WIN_CSC_KEY_PASSWORD
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Wersja i czy ma już wydanie
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Wersja $tag ma już wydanie."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "Nowa wersja $tag – bez wydania."
          fi
      - name: Wersja tagu zgodna z Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${{ steps.v.outputs.tag }}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} nie pasuje do wersji ${{ steps.v.outputs.tag }} z Cargo.toml"
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Testy
        run: cargo test --locked
      - name: Kompilacja
        run: cargo build --release --locked
      - name: Certyfikat
        if: env.CSC_LINK != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CSC_LINK))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          "SIGNTOOL=$($st.FullName)" >> $env:GITHUB_ENV
      - name: Podpis programu
        if: env.CSC_LINK != ''
        shell: pwsh
        run: '& $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:CSC_KEY_PASSWORD" /fd sha256 /tr http://timestamp.digicert.com /td sha256 target\release\Gran.exe'
      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe") { "${env:ProgramFiles(x86)}\NSIS" >> $env:GITHUB_PATH }
            else { choco install nsis -y --no-progress; "${env:ProgramFiles(x86)}\NSIS" >> $env:GITHUB_PATH }
          }
      - name: Instalator
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          makensis /V3 "/DVERSION=$env:VERSION" "/DEXE=..\target\release\Gran.exe" "/DOUT=..\release\GRAN-Setup-$env:VERSION.exe" build\gran.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Podpis instalatora
        if: env.CSC_LINK != ''
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:CSC_KEY_PASSWORD" /fd sha256 /tr http://timestamp.digicert.com /td sha256 "release\GRAN-Setup-$env:VERSION.exe"
          $sig = Get-AuthenticodeSignature "release\GRAN-Setup-$env:VERSION.exe"
          Write-Host "$($sig.Status) – $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { exit 1 }
      - name: latest.yml (suma SHA-512 dla aktualizatora)
        shell: pwsh
        run: |
          $name = "GRAN-Setup-$env:VERSION.exe"
          $file = "release\$name"
          $bytes = [IO.File]::ReadAllBytes($file)
          $sha = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash($bytes))
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          @"
          version: $env:VERSION
          files:
            - url: $name
              sha512: $sha
              size: $($bytes.Length)
          path: $name
          sha512: $sha
          releaseDate: '$date'
          "@ -replace '(?m)^          ', '' | Set-Content -Encoding utf8NoBOM release\latest.yml
          Get-Content release\latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/GRAN-Setup-*.exe
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.new == 'true') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    needs: [version, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - run: ls -la dist-release
      - name: Opis wydania
        run: |
          v="${{ needs.version.outputs.version }}"
          f="build/release-notes/$v.md"
          if [ -f "$f" ]; then cp "$f" notes.md
          else printf 'Instalator Windows `GRAN-Setup-%s.exe` – do pobrania ze strony https://redzikowski.com/portfolio/gran-3d. Zainstalowany program sam proponuje kolejne wersje.\n' "$v" > notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GRAŃ ${{ needs.version.outputs.tag }}
          make_latest: true
          body_path: notes.md
          generate_release_notes: true
          files: dist-release/*
          fail_on_unmatched_files: true
