services:
  gran:
    build: .
    ports:
      - "5190:5190"
    volumes:
      - gran-data:/data
    environment:
      TZ: Europe/Warsaw
      # odkomentuj, aby pobieranie i usuwanie kwadratów wymagało hasła
      # GRAN_ADMIN_TOKEN: "zmien-mnie"
    restart: unless-stopped
volumes:
  gran-data:
