[package]
name = "gran"
version = "2.0.0-alpha.1"
edition = "2021"
rust-version = "1.85"
description = "GRAŃ — atlas szlaków górskich 3D dla Windows"
authors = ["BlackSingularities"]
repository = "https://github.com/BlackSingularities/gran-3d"
build = "build.rs"

[[bin]]
name = "Gran"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
wgpu = "27"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip", "proxy-from-env"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
lz4_flex = "0.11"
crc32fast = "1.4"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
