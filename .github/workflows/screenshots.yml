# Zrzuty ekranu wersji na Androida (do plakatu i README): lekki emulator bez okna (x86_64 z tłumaczeniem
# ARM, renderowanie programowe swiftshader, 2 rdzenie), APK z wydania, kilka widoków otwartych linkiem
# gran://. Uruchamiany ręcznie; zrzuty trafiają do artefaktu `android-screenshots`.
name: Screenshots

on:
  workflow_dispatch:
    inputs:
      version:
        description: Wersja wydania (np. 4.0.0); pusta – najnowsze
        required: false

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: APK z wydania
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ inputs.version }}"
          if [ -n "$v" ]; then tag="v$v"; else tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName); fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'GRAN-*.apk' --dir .
          grep -v Setup <<< "$(ls GRAN-*.apk)" | head -1 > apk.txt
          cat apk.txt
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 3072M
          disk-size: 4G
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r "$(cat apk.txt)"
            mkdir -p shots
            adb shell am start -n com.blacksingularities.gran3d/.GranActivity --ez gran_capture true --es gran_link 'gran://widok?lat=49.1930&lon=20.0720&az=200&nach=38&odl=5200&styl=4'
            sleep 150
            adb exec-out screencap -p > shots/01-teren.png
            adb shell am start -n com.blacksingularities.gran3d/.GranActivity --ez gran_capture true --es gran_link 'gran://widok?lat=49.2320&lon=19.9820&az=160&nach=45&odl=7000&styl=0&trasa=49.2700,19.9800;49.2318,19.9817;49.2210,20.0090'
            sleep 120
            adb exec-out screencap -p > shots/02-trasa.png
            adb shell am start -n com.blacksingularities.gran3d/.GranActivity --ez gran_capture true --es gran_link 'gran://widok?lat=49.1790&lon=20.0880&az=320&nach=52&odl=4200&styl=2'
            sleep 90
            adb exec-out screencap -p > shots/03-nachylenie.png
            adb logcat -d -s GRAN > shots/logcat.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: shots/
          if-no-files-found: error
          retention-days: 30
