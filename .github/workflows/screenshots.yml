# Zrzuty ekranu wersji na Androida (do plakatu i README): lekki emulator bez okna (x86_64 z tłumaczeniem
# ARM, renderowanie programowe swiftshader, 2 rdzenie), APK z wydania, kilka widoków otwartych linkiem
# gran://. Uruchamiany ręcznie; zrzuty trafiają do artefaktu `android-screenshots`.
name: Screenshots

on:
  workflow_dispatch:
    inputs:
      version:
        description: Wersja wydania (np. 4.0.0); pusta – najnowsze
        required: false
      run_id:
        description: Zamiast wydania – APK z przebiegu Build o tym numerze (test przed wydaniem)
        required: false
      gpu:
        description: Grafika emulatora (guest – SwiftShader w emulatorze, swiftshader_indirect)
        required: false
        default: guest
      backend:
        description: Interfejs grafiki programu (vulkan, gl, pusty – wybór programu)
        required: false
        default: vulkan

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v4
      - name: APK z wydania
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ inputs.version }}"
          run="${{ inputs.run_id }}"
          if [ -n "$run" ]; then
            gh run download "$run" --repo "$GITHUB_REPOSITORY" -n android --dir .
          else
            if [ -n "$v" ]; then tag="v$v"; else tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName); fi
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'GRAN-*.apk' --dir .
          fi
          grep -v Setup <<< "$(ls GRAN-*.apk)" | head -1 > apk.txt
          cat apk.txt
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 4096M
          disk-size: 4G
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu ${{ inputs.gpu || 'guest' }} -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r "$(cat apk.txt)" && mkdir -p shots && adb logcat -c && GRAN_BACKEND="${{ inputs.backend }}" sh .github/emulator-shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: shots/
          if-no-files-found: error
          retention-days: 30
