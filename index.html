<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GRAŃ — atlas szlaków 3D</title>
    <meta name="description" content="Trójwymiarowy atlas polskich gór: rzeczywisty teren, szlaki PTTK, wysokości względne, trasy z alternatywami, widoczność i cienie o dowolnej porze dnia." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c1114'/%3E%3Cpath d='M6 48 L22 24 L30 34 L40 14 L58 48 Z' fill='none' stroke='%23efe7d6' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M34 26 L40 14 L46 26' fill='none' stroke='%23ff5a36' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <div id="sky"></div>
      <div id="stage"><canvas id="gl"></canvas><div id="overlay"></div></div>
      <div class="vignette"></div>

      <header id="mast">
        <a class="brand" href="#" title="GRAŃ — atlas szlaków 3D">
          <svg viewBox="0 0 64 40" aria-hidden="true"><path d="M2 36 L18 13 L26 22 L37 3 L62 36" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M31 13 L37 3 L43 13" fill="none" stroke="var(--signal)" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/></svg>
          <span class="brand__word">Grań</span>
        </a>
        <button id="region-btn" class="region" aria-haspopup="menu">
          <span class="region__name" id="region-name">Tatry</span>
          <span class="region__sub" id="region-sub"></span>
          <svg class="chev" viewBox="0 0 12 12"><path d="M3 4.5 L6 7.5 L9 4.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <div id="region-menu" class="menu" role="menu" hidden></div>
      </header>

      <button id="search-btn" class="searchbar">
        <svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 13 L17.5 17.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Szczyt, przełęcz, schronisko, szlak…</span>
        <kbd>/</kbd>
      </button>

      <nav id="rail" aria-label="Narzędzia"></nav>

      <aside id="panel">
        <div class="panel__tabs" role="tablist">
          <button data-tab="tool" class="is-on" role="tab">Narzędzie</button>
          <button data-tab="map" role="tab">Mapa i światło</button>
          <button id="panel-toggle" class="panel__collapse" title="Zwiń panel (P)">
            <svg viewBox="0 0 12 12"><path d="M4.5 3 L7.5 6 L4.5 9" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
        </div>
        <div id="panel-body" class="panel__body"></div>
      </aside>

      <section id="profile" class="profile">
        <div class="profile__head" id="profile-head"></div>
        <div class="profile__plot"><canvas id="profile-canvas"></canvas><div id="profile-tip" class="profile__tip" hidden></div></div>
      </section>

      <div id="readout" class="readout"></div>
      <div id="hud">
        <button id="compass" class="compass" title="Północ u góry (N)"></button>
        <div id="scalebar" class="scalebar"><div class="scalebar__bar"></div><span></span></div>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="palette" class="palette" hidden></div>
      <div id="ctx" class="ctx" hidden></div>
      <div id="help" class="help" hidden></div>
      <div id="attrib" class="attrib"></div>

      <div id="loader" class="loader">
        <svg id="loader-topo" class="loader__topo" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice"></svg>
        <div class="loader__inner">
          <div class="loader__kicker">atlas szlaków 3D</div>
          <div class="loader__word">Grań</div>
          <div class="loader__region" id="loader-region"></div>
          <div class="loader__bar"><i id="loader-fill"></i></div>
          <div class="loader__step" id="loader-step">Przygotowanie</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
