# GRAŃ – budowanie instalatora Windows i wydania na GitHub Releases.
#
#  • push tagu v*  → instalator .exe publikowany jako wydanie (z latest.yml dla automatycznych aktualizacji)
#  • push / pull request → kontrolna kompilacja instalatora (artefakt przebiegu, bez publikacji)
#
# Podpis cyfrowy (Authenticode): ustaw sekrety repozytorium
#   WIN_CSC_LINK          – certyfikat .pfx zakodowany base64 (albo adres https do pliku)
#   WIN_CSC_KEY_PASSWORD  – hasło do certyfikatu
# Bez nich instalator jest budowany bez podpisu.
name: Desktop

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Zależności
        run: npm ci

      - name: Wersja tagu zgodna z package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} nie pasuje do wersji v$v z package.json"
            exit 1
          fi

      - name: Sprawdzenie typów i kompilacja
        run: npm run build

      - name: Instalator (kontrolny)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win --x64 --publish never

      - name: Instalator i wydanie
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win --x64 --publish always

      - name: Weryfikacja podpisu
        if: env.CSC_LINK != ''
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter 'GRAN-Setup-*.exe' | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "$($exe.Name): $($sig.Status) – $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: GRAN-Setup-${{ github.sha }}
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
